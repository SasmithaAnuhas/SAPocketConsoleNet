<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kenny Adventure - Level 1: Sunny Meadow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- In-Game HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-group">
            <div class="hud-item" id="hearts-container"></div>
            <div class="hud-item">
                <span style="color: #ffd700;">🪙</span>
                <span id="score-text">0</span>
            </div>
            <div class="hud-item">
                <span style="color: #00d2ff;">💎</span>
                <span id="gems-text">0</span>
            </div>
        </div>
        <button class="pause-btn" id="pause-btn" title="Pause Game (ESC / P)">⏸</button>
    </div>

    <!-- UI Overlay Screens -->
    <div id="ui-overlay">
        <!-- Main Menu -->
        <div id="main-menu" class="menu" style="display: block;">
            <h1>Kenny Adventure</h1>
            <p class="subtitle">Level 1: Sunny Meadow</p>
            <button class="btn" id="start-btn">▶ Play Game</button>
            <br>
            <button class="btn btn-secondary" id="audio-toggle-btn">🔊 Sound: ON</button>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="menu">
            <h1>Game Paused</h1>
            <p class="subtitle">Take a breather!</p>
            <button class="btn" id="resume-btn">▶ Resume</button>
            <br>
            <button class="btn btn-secondary" id="restart-btn-pause">🔄 Restart Level</button>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="menu">
            <h1 style="color: #40d17a;">🎉 Stage Clear!</h1>
            <p class="subtitle">You conquered Sunny Meadow!</p>
            <div style="font-size: 20px; margin-bottom: 24px;">
                Final Score: <strong id="final-score" style="color: #ffd700;">0</strong>
            </div>
            <button class="btn" id="replay-btn">🔄 Play Again</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="menu">
            <h1 style="color: #e85b5b;">💀 Game Over</h1>
            <p class="subtitle">Kenny fell in action...</p>
            <button class="btn" id="tryagain-btn">🔄 Try Again</button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
        <div class="touch-dpad">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="touch-actions">
            <div class="touch-btn touch-btn-wide" id="btn-jump">JUMP</div>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
