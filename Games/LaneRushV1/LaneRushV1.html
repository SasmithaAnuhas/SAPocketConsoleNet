<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lane Rush - Pocket Console</title>
  <style>
    :root {
      --accent: #ff8c1a;
      --accent-glow: rgba(255, 140, 26, 0.45);
      --gold: #ffcc00;
      --gold-glow: rgba(255, 204, 0, 0.4);
      --cyan: #00ffcc;
      --danger: #ff4757;
      --bg-dark: #080c12;
      --panel-bg: rgba(13, 18, 27, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient Highway Glow */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, rgba(255, 140, 26, 0.1), transparent 65%),
                  radial-gradient(circle at 80% 80%, rgba(0, 255, 204, 0.06), transparent 60%);
      z-index: 1;
    }

    #wrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 5;
    }

    canvas {
      display: block;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      touch-action: none;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 140, 26, 0.15);
    }

    /* Navigation Header Bar */
    .nav-bar {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 25;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .nav-btn.console-back {
      background: rgba(255, 140, 26, 0.12);
      border-color: rgba(255, 140, 26, 0.35);
      color: var(--accent);
    }
    .nav-btn.console-back:hover {
      background: rgba(255, 140, 26, 0.25);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Top Racing HUD */
    .hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(10, 15, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      user-select: none;
      z-index: 25;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      padding: 3px 8px;
    }
    .hud-pill b {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }
    .hud-pill.score b {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }
    .hud-pill.best b {
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
    }
    .hud-pill.speed {
      color: #ffaa44;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .hud-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: scale(1.05);
    }

    /* Mobile Touch Steering Controls */
    .touch {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      display: none;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      z-index: 25;
    }
    .touch-btn {
      pointer-events: auto;
      flex: 1;
      height: 64px;
      border-radius: 18px;
      border: 1px solid rgba(255, 140, 26, 0.3);
      background: rgba(18, 25, 38, 0.82);
      color: #f1f5f9;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      cursor: pointer;
    }
    .touch-btn:active {
      background: rgba(255, 140, 26, 0.28);
      border-color: var(--accent);
      color: #fff;
      transform: scale(0.96);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Modals & Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(5, 8, 14, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 35;
      padding: 16px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .panel {
      width: min(92vw, 440px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 26px 24px;
      color: #e6eefc;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255, 140, 26, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 140, 26, 0.12);
      border: 1px solid rgba(255, 140, 26, 0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .panel h1 {
      margin: 0 0 4px 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #ff8c1a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel p {
      margin: 0 0 18px 0;
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.45;
    }

    /* Score Summary Card */
    .score-card {
      width: 100%;
      background: rgba(10, 15, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .score-val {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }
    .score-val.highlight {
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }
    .new-record-badge {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, rgba(255, 204, 0, 0.15), rgba(255, 140, 0, 0.2));
      border: 1px solid rgba(255, 204, 0, 0.4);
      color: #ffd700;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      display: none;
    }

    /* Difficulty Pills Selector */
    .diff-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .diff-group {
      display: flex;
      width: 100%;
      background: rgba(10, 15, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 18px;
    }
    .diff-btn {
      flex: 1;
      padding: 9px 10px;
      border: none;
      background: transparent;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .diff-btn.active {
      background: rgba(255, 140, 26, 0.2);
      color: #ffaa44;
      box-shadow: 0 0 12px rgba(255, 140, 26, 0.25);
      font-weight: 700;
    }

    /* Native select hidden for compatibility */
    #difficulty { display: none; }

    /* Action Buttons */
    .primary {
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ff8c1a, #ff5500);
      color: #1a0800;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 140, 26, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 140, 26, 0.5);
      filter: brightness(1.08);
    }
    .primary:active {
      transform: translateY(0);
    }

    .secondary {
      width: 100%;
      margin-top: 10px;
      padding: 11px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: all 0.2s ease;
    }
    .secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .small {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Back to Console Navigation -->
  <div class="nav-bar">
    <a href="../../index.html" class="nav-btn console-back" title="Back to Pocket Console">🎮 Console</a>
  </div>

  <!-- Modern Floating Racing HUD -->
  <div class="hud" id="hud">
    <div class="hud-pill score">Score: <b id="score">0</b></div>
    <div class="hud-pill best">Best: <b id="best">0</b></div>
    <div class="hud-pill speed" id="speedPill">⚡ <b id="speedVal">120</b> <small>KM/H</small></div>
    <button class="hud-btn" id="pauseBtn" type="button" title="Pause Game (P / Esc)">⏸</button>
    <button class="hud-btn" id="audioToggleBtn" type="button" title="Toggle Sound">🔊</button>
    <button class="hud-btn" id="restart" type="button" title="Restart Run (R)">🔄</button>
  </div>

  <div id="wrap">
    <canvas id="c"></canvas>
  </div>

  <!-- Touch Steering Buttons for Mobile -->
  <div class="touch" id="touch">
    <button class="touch-btn" id="left" type="button">◀ Steer Left</button>
    <button class="touch-btn" id="right" type="button">Steer Right ▶</button>
  </div>

  <!-- Unified Game Modal (Start, Pause, Game Over) -->
  <div class="overlay" id="overlay">
    <div class="panel">
      <span class="game-badge" id="overlayBadge">Pocket Console</span>
      <h1 id="overlayTitle">LANE RUSH</h1>
      <p id="overlaySubtitle">Avoid obstacles. Survive as long as possible.</p>

      <!-- Score Summary on Pause / Game Over -->
      <div class="score-card" id="scoreCard" style="display:none;">
        <div id="newRecordBadge" class="new-record-badge">🔥 NEW PERSONAL BEST!</div>
        <div class="score-item">
          <span class="score-label">Run Score</span>
          <span class="score-val highlight" id="modalScoreVal">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">High Score</span>
          <span class="score-val" id="modalBestVal">0</span>
        </div>
      </div>

      <!-- Difficulty Selector Pills -->
      <div id="difficultyBlock" style="width:100%;">
        <div class="diff-title">Difficulty</div>
        <div class="diff-group" id="diffGroup">
          <button type="button" class="diff-btn" data-diff="easy">Cruising</button>
          <button type="button" class="diff-btn active" data-diff="medium">Highway</button>
          <button type="button" class="diff-btn" data-diff="hard">Turbo</button>
        </div>
        <!-- Hidden select for compatibility -->
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <button class="primary" id="startBtn">Start Game</button>
      <button class="secondary" id="fsBtn">Full Screen</button>
      <a href="../../index.html" class="secondary" id="consoleBtn">Return to Console</a>

      <div class="small" id="hint">
        Controls: Arrow keys / A-D to steer • Space / P to pause • R to restart
      </div>
    </div>
  </div>

<script>
(() => {

  // ==========================================
  // Web Audio Synthesizer Engine & SFX
  // ==========================================
  class RacingAudio {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.engineOsc = null;
      this.engineGain = null;
    }
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    }
    startEngine() {
      if (this.muted) return;
      this.init();
      if (!this.ctx || this.engineOsc) return;
      try {
        this.engineOsc = this.ctx.createOscillator();
        this.engineGain = this.ctx.createGain();
        this.engineOsc.type = "sawtooth";
        this.engineOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
        this.engineGain.gain.setValueAtTime(0.035, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(280, this.ctx.currentTime);

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);
        this.engineOsc.start();
      } catch (e) {}
    }
    stopEngine() {
      if (this.engineOsc) {
        try {
          this.engineOsc.stop();
          this.engineOsc.disconnect();
        } catch (e) {}
        this.engineOsc = null;
        this.engineGain = null;
      }
    }
    updateEnginePitch(speedVal) {
      if (!this.engineOsc || this.muted) return;
      try {
        const freq = 48 + Math.min(120, speedVal * 0.16);
        this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.08);
      } catch (e) {}
    }
    play(type) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      try {
        const t = this.ctx.currentTime;
        if (type === "steer") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(280, t + 0.08);
          gain.gain.setValueAtTime(0.06, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === "crash") {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.45);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.45);

          const bufferSize = Math.floor(this.ctx.sampleRate * 0.35);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.25, t);
          noiseGain.gain.linearRampToValueAtTime(0.001, t + 0.35);
          noise.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(t);
        } else if (type === "record") {
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = "triangle";
            o.frequency.setValueAtTime(freq, t + idx * 0.08);
            g.gain.setValueAtTime(0.16, t + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.32);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(t + idx * 0.08);
            o.stop(t + idx * 0.08 + 0.32);
          });
        }
      } catch (e) {}
    }
  }

  const audio = new RacingAudio();
  const particles = [];

  function spawnExplosion(x, y) {
    const colors = ["#ff4757", "#ff8c1a", "#ffd166", "#ffffff", "#8fa0b5"];
    for (let i = 0; i < 35; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 240;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: colors[(Math.random() * colors.length) | 0],
        size: 3 + Math.random() * 5,
        life: 0.6 + Math.random() * 0.4,
        maxLife: 1.0,
      });
    }
  }

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const hud = document.getElementById("hud");
  const touch = document.getElementById("touch");

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const speedValEl = document.getElementById("speedVal");
  const restartBtn = document.getElementById("restart");
  const pauseBtn = document.getElementById("pauseBtn");

  const audioToggleBtn = document.getElementById("audioToggleBtn");
  if (audioToggleBtn) {
    audioToggleBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;
      audioToggleBtn.textContent = audio.muted ? "🔇" : "🔊";
      audioToggleBtn.style.opacity = audio.muted ? "0.6" : "1";
      if (!audio.muted && state.mode === "play") audio.startEngine();
      else if (audio.muted) audio.stopEngine();
    });
  }


  const overlay = document.getElementById("overlay");
  const overlayBadge = document.getElementById("overlayBadge");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlaySubtitle = document.getElementById("overlaySubtitle");
  const scoreCard = document.getElementById("scoreCard");
  const modalScoreVal = document.getElementById("modalScoreVal");
  const modalBestVal = document.getElementById("modalBestVal");
  const newRecordBadge = document.getElementById("newRecordBadge");
  const difficultySel = document.getElementById("difficulty");
  const difficultyBlock = document.getElementById("difficultyBlock");
  const startBtn = document.getElementById("startBtn");
  const fsBtn = document.getElementById("fsBtn");

  const ASSETS = {
    road: "Assets/Road/Track1/ModedRoadAsphalt1.png",
    roadEdge: "Assets/Road/Grass/ModedLandGrass1.png",
    player: "Assets/Cars/ModedYellow Car1.png",
    car2: "Assets/Cars/ModedRedCar1.png",
    car3: "Assets/Cars/ModedBlackCar1.png",
  };

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Failed to load: " + src));
      img.src = src;
    });
  }

  function aabb(a, b) {
    return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
  }

  // Virtual resolution
  const V_W = 540;
  const V_H = 960;

  // ===== 3 LANE SYSTEM =====
  const LANES = 3;
  const roadWidth = Math.floor(V_W * 0.64);
  const laneW = Math.floor(roadWidth / LANES);
  const road = {
    x: Math.floor((V_W - (laneW * LANES)) / 2),
    y: 0,
    w: laneW * LANES,
    h: V_H,
  };

  function computeLaneCenters() {
    return Array.from({ length: LANES }, (_, i) =>
      road.x + (laneW * (i + 0.5))
    );
  }
  function computeLaneDividers() {
    return Array.from({ length: LANES - 1 }, (_, i) =>
      road.x + (laneW * (i + 1))
    );
  }
  let laneCenters = computeLaneCenters();
  let laneDividers = computeLaneDividers();

  const state = {
    mode: "menu", // "menu" | "play" | "pause" | "over"
    tPrev: performance.now(),
    score: 0,
    best: Number(localStorage.getItem("car_best") || 0),
    speed: 380,
    spawnTimer: 0,
    spawnEvery: 0.85,
    scrollY: 0,
    steer: 0,
    difficulty: "medium",
  };
  bestEl.textContent = state.best;

  const keys = { left:false, right:false };

  function isTouchDevice() {
    return (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  }

  function setUIForMode() {
    if (state.mode === "play") {
      overlay.style.display = "none";
      hud.style.display = "flex";
      touch.style.display = isTouchDevice() ? "flex" : "none";
    } else {
      overlay.style.display = "grid";
      hud.style.display = "none";
      touch.style.display = "none";
    }
  }

  function applyDifficulty(diff) {
    if (diff === "easy") {
      state.speed = 320;
      state.spawnEvery = 1.05;
    } else if (diff === "hard") {
      state.speed = 460;
      state.spawnEvery = 0.62;
    } else {
      state.speed = 380;
      state.spawnEvery = 0.85;
    }
    state.difficulty = diff;
    difficultySel.value = diff;

    document.querySelectorAll('#diffGroup .diff-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-diff') === diff);
    });
  }

  function resetRun(diff) {
    applyDifficulty(diff);

    state.score = 0;
    state.spawnTimer = 0;
    state.scrollY = 0;
    state.steer = 0;

    obstacles.length = 0;

    player.x = road.x + road.w/2;
    player.vx = 0;

    scoreEl.textContent = "0";
    if (speedValEl) speedValEl.textContent = Math.round(state.speed * 0.32);
  }

  function showMenu() {
    state.mode = "menu";
    overlayBadge.textContent = "Arcade Survival";
    overlayBadge.style.color = "var(--accent)";
    overlayBadge.style.borderColor = "rgba(255, 140, 26, 0.3)";
    overlayTitle.textContent = "LANE RUSH";
    overlaySubtitle.textContent = "Dodge oncoming traffic. Test your reflex & speed.";
    startBtn.textContent = "Start Game";
    difficultyBlock.style.display = "block";
    scoreCard.style.display = "none";
    setUIForMode();
  }

  function pauseGame() {
    audio.stopEngine();
    if (state.mode !== "play") return;
    state.mode = "pause";
    overlayBadge.textContent = "Paused";
    overlayBadge.style.color = "var(--cyan)";
    overlayBadge.style.borderColor = "rgba(0, 255, 204, 0.3)";
    overlayTitle.textContent = "PAUSED";
    overlaySubtitle.textContent = "Catch your breath and jump back into the rush.";
    startBtn.textContent = "Resume";
    difficultyBlock.style.display = "none";

    scoreCard.style.display = "grid";
    newRecordBadge.style.display = "none";
    modalScoreVal.textContent = state.score;
    modalBestVal.textContent = state.best;

    setUIForMode();
  }

  function resumeGame() {
    audio.startEngine();
    state.mode = "play";
    state.tPrev = performance.now();
    setUIForMode();
  }

  function showGameOver() {
    audio.stopEngine();
    audio.play("crash");
    if (isNewBest) audio.play("record");
    state.mode = "over";
    const isNewBest = state.score > 0 && state.score >= state.best;

    overlayBadge.textContent = "Highway Crash";
    overlayBadge.style.color = "var(--danger)";
    overlayBadge.style.borderColor = "rgba(255, 71, 87, 0.3)";
    overlayTitle.textContent = "GAME OVER";
    overlaySubtitle.textContent = isNewBest
      ? "Phenomenal run! You reached a new personal record!"
      : "You clipped another vehicle. Dust off and try again!";
    startBtn.textContent = "Play Again";
    difficultyBlock.style.display = "block";

    scoreCard.style.display = "grid";
    newRecordBadge.style.display = isNewBest ? "block" : "none";
    modalScoreVal.textContent = state.score;
    modalBestVal.textContent = state.best;

    setUIForMode();
  }

  async function requestFullScreen() {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) return true;
      if (el.requestFullscreen) { await el.requestFullscreen(); return true; }
      if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); return true; }
    } catch (e) {}
    return false;
  }

  function resizeCanvas() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const targetAspect = V_W / V_H;
    let drawW = vw;
    let drawH = vw / targetAspect;

    if (drawH > vh) {
      drawH = vh;
      drawW = vh * targetAspect;
    }

    canvas.style.width = Math.floor(drawW) + "px";
    canvas.style.height = Math.floor(drawH) + "px";

    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(drawW * dpr);
    canvas.height = Math.floor(drawH * dpr);

    ctx.setTransform(canvas.width / V_W, 0, 0, canvas.height / V_H, 0, 0);
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", resizeCanvas);

  const leftBtn = document.getElementById("left");
  const rightBtn = document.getElementById("right");
  function bindHold(btn, onDown, onUp) {
    const down = (e) => { e.preventDefault(); onDown(); };
    const up = (e) => { e.preventDefault(); onUp(); };
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
  }
  bindHold(leftBtn, () => keys.left = true, () => keys.left = false);
  bindHold(rightBtn, () => keys.right = true, () => keys.right = false);

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
    if (e.key === " " || e.key === "Escape" || e.key.toLowerCase() === "p") {
      e.preventDefault();
      if (state.mode === "play") pauseGame();
      else if (state.mode === "pause") resumeGame();
    }
    if (e.key.toLowerCase() === "r") {
      if (state.mode === "play" || state.mode === "pause") resetRun(state.difficulty);
      else showMenu();
    }
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
  });

  fsBtn.addEventListener("click", async () => {
    await requestFullScreen();
    resizeCanvas();
  });

  startBtn.addEventListener("click", async () => {
    audio.init();
    audio.startEngine();
    if (state.mode === "pause") {
      resumeGame();
      return;
    }
    await requestFullScreen();
    resizeCanvas();
    resetRun(difficultySel.value);
    state.mode = "play";
    state.tPrev = performance.now();
    setUIForMode();
  });

  restartBtn.addEventListener("click", () => resetRun(state.difficulty));
  pauseBtn.addEventListener("click", () => {
    if (state.mode === "play") pauseGame();
  });

  // Difficulty Pills click handling
  document.querySelectorAll('#diffGroup .diff-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const diff = e.currentTarget.getAttribute('data-diff');
      applyDifficulty(diff);
    });
  });

  // Entities
  let imgs = {};
  const player = { x: road.x + road.w/2, y: Math.floor(V_H * 0.78), w: 80, h: 150, vx: 0 };
  const obstacles = [];

  function spawnObstacle() {
    const choices = [
      { img: imgs.car2, w: 80, h: 150, type: "car" },
      { img: imgs.car3, w: 80, h: 150, type: "car" },
    ];
    const pick = choices[(Math.random() * choices.length) | 0];
    const maxTries = 12;

    for (let attempt = 0; attempt < maxTries; attempt++) {
      const laneIndex = (Math.random() * LANES) | 0;
      const x = laneCenters[laneIndex];
      const y = -140;

      const minGap = pick.h + 90;
      let blocked = false;

      for (const o of obstacles) {
        const sameLane = Math.abs(o.x - x) < 5;
        if (!sameLane) continue;

        const oy = (typeof o.baseY === "number") ? o.baseY : o.y;
        if (oy < 220 || Math.abs(oy - y) < minGap) {
          blocked = true;
          break;
        }
      }

      if (blocked) continue;

      const speedMul = 0.85 + Math.random() * 0.30;
      const bobOffset = Math.random() * Math.PI * 2;
      const bobSpeed = 2 + Math.random() * 1.5;
      const bobAmount = pick.type === "car" ? 3 : 2;

      obstacles.push({
        x,
        y,
        baseY: y,
        w: pick.w,
        h: pick.h,
        img: pick.img,
        speedMul,
        bobOffset,
        bobSpeed,
        bobAmount,
      });

      return;
    }
  }

  function drawTiled(img, x, y, w, h, offsetY) {
    const tileW = img.width;
    const tileH = img.height;
    const startY = y - (offsetY % tileH) - tileH;
    for (let yy = startY; yy < y + h + tileH; yy += tileH) {
      for (let xx = x; xx < x + w; xx += tileW) {
        ctx.drawImage(img, xx, yy, tileW, tileH);
      }
    }
  }

  function drawTiledYScaled(img, x, y, w, h, offsetY) {
    const scale = w / img.width;
    const tileH = img.height * scale;
    const startY = y - (offsetY % tileH) - tileH;
    for (let yy = startY; yy < y + h + tileH; yy += tileH) {
      ctx.drawImage(img, x, yy, w, tileH);
    }
  }

  function drawRoadInLanes(img, offsetY) {
    for (let i = 0; i < LANES; i++) {
      const x = road.x + (laneW * i);
      drawTiledYScaled(img, x, 0, laneW, V_H, offsetY);
    }
  }

  function drawCentered(img, x, y, w, h, rotationRad = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotationRad);
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
  }

  function update(dt) {
    if (state.mode !== "play") return;

    const targetSteer = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    state.steer += (targetSteer - state.steer) * Math.min(1, dt * 12);

    const maxSpeedX = 520;
    player.vx = state.steer * maxSpeedX;
    player.x += player.vx * dt;

    const halfW = player.w * 0.5;
    const leftBound = road.x + halfW;
    const rightBound = road.x + road.w - halfW;
    player.x = Math.max(leftBound, Math.min(rightBound, player.x));

    // World scroll
    state.scrollY += state.speed * dt;

    // Difficulty ramp
    state.speed += 8 * dt;
    state.spawnEvery = Math.max(
      state.difficulty === "easy" ? 0.65 : (state.difficulty === "hard" ? 0.42 : 0.52),
      state.spawnEvery - (0.012 * dt)
    );

    // Spawn
    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnEvery) {
      state.spawnTimer = 0;
      spawnObstacle();
    }

    for (const o of obstacles) {
      o.baseY += state.speed * o.speedMul * dt;
      const bob = Math.sin((state.scrollY * 0.02 * o.bobSpeed) + o.bobOffset) * o.bobAmount;
      o.y = o.baseY + bob;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      if (obstacles[i].y > V_H + 200) obstacles.splice(i, 1);
    }

    state.score += Math.floor(dt * 120);
    scoreEl.textContent = state.score;
    if (speedValEl) speedValEl.textContent = Math.round(state.speed * 0.32);
    audio.updateEnginePitch(state.speed);

    const pBox = {
      x: player.x - player.w/2 + 10,
      y: player.y - player.h/2 + 18,
      w: player.w - 20,
      h: player.h - 28,
    };

    for (const o of obstacles) {
      const oBox = { x: o.x - o.w/2, y: o.y - o.h/2, w: o.w, h: o.h };
      if (aabb(pBox, oBox)) {
        spawnExplosion(player.x, player.y);
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem("car_best", String(state.best));
          bestEl.textContent = state.best;
        }
        showGameOver();
        break;
      }
    }
  }

  function render() {
    drawTiled(imgs.roadEdge, 0, 0, road.x, V_H, -state.scrollY * 0.6);
    drawTiled(imgs.roadEdge, road.x + road.w, 0, V_W - (road.x + road.w), V_H, -state.scrollY * 0.6);
    drawRoadInLanes(imgs.road, -state.scrollY);

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.setLineDash([28, 26]);
    ctx.lineDashOffset = -(state.scrollY * 0.6);
    for (const x of laneDividers) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, V_H);
      ctx.stroke();
    }
    ctx.restore();

    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(road.x - 4, 0, 2, V_H);
    ctx.fillRect(road.x + road.w + 2, 0, 2, V_H);
    ctx.globalAlpha = 1;

    for (const o of obstacles) drawCentered(o.img, o.x, o.y, o.w, o.h, 0);

    const tilt = state.steer * 0.18;
    drawCentered(imgs.player, player.x, player.y, player.w, player.h, tilt);
  }

  function loop(tNow) {

    // Update and draw crash particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.life -= 0.016;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const dt = Math.min(0.033, (tNow - state.tPrev) / 1000);
    state.tPrev = tNow;

    ctx.clearRect(0, 0, V_W, V_H);
    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  // Boot
  resizeCanvas();
  showMenu();
  setUIForMode();

  Promise.all([
    loadImage(ASSETS.road),
    loadImage(ASSETS.roadEdge),
    loadImage(ASSETS.player),
    loadImage(ASSETS.car2),
    loadImage(ASSETS.car3),
  ]).then(([roadImg, edgeImg, playerImg, car2Img, car3Img]) => {
    imgs = { road: roadImg, roadEdge: edgeImg, player: playerImg, car2: car2Img, car3: car3Img };
    laneCenters = computeLaneCenters();
    laneDividers = computeLaneDividers();
    requestAnimationFrame((t) => { state.tPrev = t; requestAnimationFrame(loop); });
  }).catch(err => {
    overlayTitle.textContent = "ASSET LOAD ERROR";
    overlaySubtitle.textContent = String(err.message || err);
    difficultyBlock.style.display = "none";
    startBtn.style.display = "none";
    fsBtn.style.display = "none";
    console.error(err);
  });
})();
</script>
</body>
</html>
